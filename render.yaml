services:
  - type: web
    name: azure-devops-mcp-server
    runtime: node
    plan: free
    branch: supergateway-render
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AZURE_DEVOPS_ORG
        value: GOpus
      - key: ADO_MCP_AUTH_TOKEN
        sync: false
